name: claude-haiku-5-5
backend: openai
model: anthropic/claude-haiku-5.5
base_url: https://openrouter.ai/api/v1
endpoint: openrouter               # OpenAI-compatible gateway; model identity as declared by the gateway
api_key: ${OPENROUTER_API_KEY}          # resolved from the environment; never commit keys
family: claude
role: main               # main = union pool; tier = intersection pool (capability-tier comparison)
disable_thinking: false
send_thinking_kwarg: false
max_retries: 8               # transient 429 / 5xx (overload) on gateways   # gateways: no extra_body, no seed
gen:
  top_p: null                # omit: some providers reject temperature + top_p together
  max_tokens: 4096           # screening used 1024 (+4096 re-ask for truncated calls, see 14b); 4096 for later phases
