name: gpt-5.6-luna
backend: openai
model: openai/gpt-5.6-luna
base_url: https://api.ominigate.ai/v1
endpoint: omnigate               # OpenAI-compatible gateway; model identity as declared by the gateway
api_key: ${OMNIGATE_API_KEY}          # resolved from the environment; never commit keys
family: gpt
role: main               # main = union pool; tier = intersection pool (capability-tier comparison)
disable_thinking: false
send_thinking_kwarg: false
max_retries: 8               # transient 429 / 5xx (overload) on gateways   # gateways: no extra_body, no seed
gen:
  top_p: null                # omit: some providers reject temperature + top_p together
  max_tokens: 4096           # not used in the paper
